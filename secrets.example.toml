# 예시 파일: 실제 비밀번호가 아닙니다.
# Community Cloud -> App settings -> Secrets에 값을 입력하세요.
# 실값이 들어간 secrets.toml은 GitHub에 업로드하지 마세요.
[app]
mode = "live"
# 승인된 이용자 전원. 로그인 성공만으로 권한을 부여하지 않습니다.
allowed_emails = ["operator@example.com", "viewer@example.com"]
# 아래 이용자만 업로드 가능. 나머지 승인 이용자는 조회/백업만 가능합니다.
editors = ["operator@example.com"]
# 관리자 또는 회사가 승인한 PostgreSQL 접속 문자열을 입력하세요.
# 비밀번호 특수문자는 URI 인코딩이 필요합니다. TLS 호스트 인증은 verify-full 권장.
database_url = "postgresql://USER:PASSWORD@HOST:5432/DBNAME?sslmode=verify-full"

# 아래 예시는 Google OIDC용입니다.
# 공급자가 email 및 email_verified=true 클레임을 발급해야 접근을 허용합니다.
[auth]
redirect_uri = "https://YOUR-SUBDOMAIN.streamlit.app/oauth2callback"
cookie_secret = "REPLACE-WITH-A-LONG-RANDOM-SECRET"
client_id = "REPLACE-WITH-OIDC-CLIENT-ID"
client_secret = "REPLACE-WITH-OIDC-CLIENT-SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
